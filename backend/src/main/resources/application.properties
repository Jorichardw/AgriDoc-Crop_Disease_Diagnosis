# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/agridoc?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads/

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.agridoc=DEBUG

# Google Gemini API Configuration (Free Tier)
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
# Free models: gemini-2.0-flash, gemini-1.5-flash, gemini-2.5-flash (check availability)
gemini.model=gemini-1.5-flash
