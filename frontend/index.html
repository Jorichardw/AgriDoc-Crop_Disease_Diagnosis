<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriDoc - Crop Disease Diagnosis & Advisory</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <style>
        /* Special styles for landing split view */
        .landing-container {
            max-width: 1200px;
            margin: 0 auto;
            min-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
            gap: 40px;
            flex-wrap: wrap;
        }
        .landing-info {
            flex: 1;
            min-width: 320px;
            color: var(--bg-dark);
        }
        .landing-info h1 {
            font-size: 2.8rem;
            line-height: 1.2;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .landing-info h1 span {
            color: var(--primary-green);
        }
        .landing-info p {
            font-size: 1.1rem;
            color: #424242;
            margin-bottom: 30px;
        }
        .landing-features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .feature-item {
            background: white;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            border-bottom: 3px solid var(--secondary-green);
        }
        .feature-item h3 {
            font-size: 1rem;
            color: var(--primary-green);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .feature-item p {
            font-size: 0.82rem;
            margin: 0;
            color: #616161;
        }
        .login-card-wrapper {
            flex: 1;
            min-width: 320px;
            display: flex;
            justify-content: center;
        }
        @media (max-width: 768px) {
            .landing-container {
                flex-direction: column;
                padding: 20px;
            }
            .landing-info {
                text-align: center;
            }
            .landing-features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <main class="auth-wrapper page-fade-in">
        <div class="auth-card">
            <div style="display: flex; justify-content: center; margin-bottom: 20px;">
                <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; font-size: 1.8rem; font-weight: 700; color: var(--bg-dark);">
                    <img src="logo.png" alt="AgriDoc Logo" style="height: 38px; width: auto; border-radius: 4px;">
                    Agri<span style="color: var(--primary-green);">Doc</span>
                </a>
            </div>
            <h2>Welcome Back</h2>
            <p class="subtitle">Log in to manage your crops and reports</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter your username" required autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                    Sign In 🚀
                </button>
            </form>
            
            <div class="auth-footer">
                Don't have an account? <a href="pages/register.html">Register here</a>
            </div>
        </div>
    </main>

    <!-- Core APIs and authentication scripts -->
    <script src="js/api.js?v=2"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            
            // Client-side validation
            if (!usernameInput || !passwordInput) {
                showAlert('Username and password are required', 'danger');
                return;
            }
            
            try {
                const response = await api.login(usernameInput, passwordInput);
                if (response && response.token) {
                    showAlert(`Logged in successfully! Welcome ${response.fullName}`, 'success');
                    setTimeout(() => {
                        redirectUserToDashboard(response.role);
                    }, 800);
                }
            } catch (error) {
                showAlert(error.message, 'danger');
            }
        });
    </script>
</body>
</html>
